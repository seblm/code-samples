name: Scala CI

on:
  push:
    branches: [ main ]
    paths:
      - 'scala/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'scala/**'

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - run: sbt scalafmtCheckAll compile
        working-directory: scala
